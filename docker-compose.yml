version: '3.8'

services:
  # Master Node - NameNode + ResourceManager
  master:
    build: ./docker/hadoop
    container_name: hadoop-master
    hostname: master
    ports:
      - "9870:9870"  # HDFS NameNode Web UI
      - "8088:8088"  # YARN ResourceManager Web UI
      - "7077:7077"  # Spark Master
      - "8080:8080"  # Spark Master Web UI
    environment:
      - NODE_TYPE=master
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    networks:
      hadoop-net:
        ipv4_address: 172.25.0.10

  # Worker Node 1
  worker1:
    build: ./docker/hadoop
    container_name: hadoop-worker1
    hostname: worker1
    ports:
      - "9864:9864"  # DataNode Web UI
      - "8081:8081"  # Spark Worker Web UI
    environment:
      - NODE_TYPE=worker
    depends_on:
      - master
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    networks:
      hadoop-net:
        ipv4_address: 172.25.0.11

  # Worker Node 2
  worker2:
    build: ./docker/hadoop
    container_name: hadoop-worker2
    hostname: worker2
    ports:
      - "9865:9864"  # DataNode Web UI
      - "8082:8081"  # Spark Worker Web UI
    environment:
      - NODE_TYPE=worker
    depends_on:
      - master
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    networks:
      hadoop-net:
        ipv4_address: 172.25.0.12

networks:
  hadoop-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
